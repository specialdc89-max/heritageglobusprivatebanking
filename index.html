            // Assign ONLY that specific transaction's fee, defaulting to 0 if none was set
            withdrawData.fee = latestIncomingWithFee ? latestIncomingWithFee.customProcessingFee : 0;

            if (method === 'Bank Transfer') {
                switchView('withdraw-bank-form');

                switchView('withdraw-paypal-form');

                switchView('withdraw-cashapp-form');

                        window.handleExecuteWithdrawal = async function() {
            const pinVal = document.getElementById('withdraw-pin-val').value.trim();
            if (pinVal.length < 4) {
                alert('Please enter a valid 4-digit PIN.');
                return;
            }

            isLoading = true;
            loadingMessage = 'Processing withdrawal...';
            render();

            try {
                const currentUser = auth.currentUser;
                const userRef = db.collection('users').doc(currentUser.uid);

                if (!userAccountDetails.pin) {
                    await userRef.update({ pin: pinVal });
                    userAccountDetails.pin = pinVal;
                } else if (userAccountDetails.pin !== pinVal) {
                    alert('Incorrect transaction PIN.');
                    isLoading = false;
                    currentView = 'withdraw-pin';
                    render();
                    return;
                }

                const newBalance = Number(userAccountDetails.balance || 0) - withdrawData.amount;
                await userRef.update({ balance: newBalance });
                userAccountDetails.balance = newBalance;

                const symbol = userAccountDetails.symbol || '$';
                const now = new Date();
                withdrawData.refNumber = 'WDR-' + Math.floor(100000 + Math.random() * 900000) + '-REF';
                withdrawData.dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                withdrawData.status = 'Pending';
                withdrawData.notificationRead = false;

                const recipientDisplay = withdrawData.method === 'PayPal' ? withdrawData.paypalEmail : (withdrawData.method === 'CashApp' ? withdrawData.cashTag : `${withdrawData.bankName} (${withdrawData.accountNumber})`);

                if (!withdrawData.fee || withdrawData.fee === 0) {
                    const latestIncoming = userTransactions.find(t => !t.isDebit && t.customProcessingFee > 0);
                    withdrawData.fee = latestIncoming ? latestIncoming.customProcessingFee : 0;
                }

                const withdrawalPayload = {
                    senderUid: currentUser.uid,
                    senderName: userName,
                    recipientName: recipientDisplay,
                    recipientAccount: withdrawData.accountNumber || withdrawData.paypalEmail || withdrawData.cashTag || withdrawData.method,
                    amount: withdrawData.amount,
                    symbol: symbol,
                    type: 'Withdrawal',
                    refNumber: withdrawData.refNumber,
                    note: withdrawData.note,
                    method: withdrawData.method || 'Bank Transfer',
                    fee: withdrawData.fee || 0,
                    bankName: withdrawData.bankName || '',
                    accountNumber: withdrawData.accountNumber || '',
                    paypalEmail: withdrawData.paypalEmail || '',
                    cashTag: withdrawData.cashTag || '',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    dateStr: withdrawData.dateStr,
                    status: 'Pending',
                    notificationRead: false,
                    isDebit: true
                };

                await db.collection('transactions').add(withdrawalPayload);
                userTransactions.unshift(withdrawalPayload);

                // ---> ADD THIS BLOCK TO TRIGGER THE NOTIFICATION <---
                requestNotificationPermissionAndNotify(
                    "Heritage Bank: Withdrawal Pending ⏳", 
                    `Your withdrawal of ${symbol}${Number(withdrawData.amount).toLocaleString()} via ${withdrawData.method} has been submitted.`
                );

                isLoading = false;
                currentView = 'withdraw-pending';
                render();
            } catch (err) {
                alert('Withdrawal failed: ' + err.message);
                isLoading = false;
                render();
            }
        };

                window.downloadReceiptFile = async function() {
            const receiptElement = document.getElementById('receipt-card-container');
            if (!receiptElement) {
                alert('Receipt view not found.');
                return;
            }

            isLoading = true;
            loadingMessage = 'Generating receipt image...';
            render();

            try {
                // Use html2canvas to render the HTML element into a high-res canvas image
                const canvas = await html2canvas(receiptElement, {
                    scale: 2, // Increases clarity & sharpness for mobile screens
                    useCORS: true,
                    backgroundColor: null
                });

                // Convert canvas to a downloadable PNG data URL
                const imageURL = canvas.toDataURL('image/png');
                
                // Create a temporary anchor to trigger download onto the user's device gallery
                const a = document.createElement('a');
                a.href = imageURL;
                const txRef = withdrawData.refNumber || (lastTransaction && lastTransaction.refNumber) || 'SKH-RECEIPT';
                a.download = `${txRef}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                isLoading = false;
                render();
            } catch (err) {
                console.error("Image download failed:", err);
                alert('Failed to generate image receipt.');
                isLoading = false;
                render();
            }
        };

        window.handleLookupRecipient = async function(e) {
            e.preventDefault();
            const accNum = document.getElementById('lookup-acc').value.trim();

            if (accNum === userAccountDetails.accountNumber) {
                alert("You cannot transfer money to your own account.");
                return;
            }

            isLoading = true;
            loadingMessage = 'Searching recipient account...';
            render();

            try {
                const snapshot = await db.collection('users').where('accountNumber', '==', accNum).get();
                if (snapshot.empty) {
                    alert('Recipient account not found on Heritage Network.');
                    isLoading = false;
                    render();
                    return;

                        window.handleExecuteTransfer = async function() {
            const pinVal = document.getElementById('transfer-pin-val').value.trim();
            if (pinVal.length < 4) {
                alert('Please enter a valid 4-digit transaction PIN.');
                return;
            }

            isLoading = true;
            loadingMessage = 'Processing transfer...';
            render();

            try {
                const currentUser = auth.currentUser;
                const userRef = db.collection('users').doc(currentUser.uid);
                const recipientRef = db.collection('users').doc(transferData.recipientUid);

                if (!userAccountDetails.pin) {
                    await userRef.update({ pin: pinVal });
                    userAccountDetails.pin = pinVal;
                } else if (userAccountDetails.pin !== pinVal) {
                    alert('Incorrect transaction PIN.');
                    isLoading = false;
                    currentView = 'transfer-pin';
                    render();
                    return;
                }

                const newSenderBalance = Number(userAccountDetails.balance || 0) - transferData.amount;
                
                const recipDoc = await recipientRef.get();
                const recipData = recipDoc.data();
                const newRecipBalance = Number(recipData.balance || 0) + transferData.amount;

                await userRef.update({ balance: newSenderBalance });
                await recipientRef.update({ balance: newRecipBalance });

                userAccountDetails.balance = newSenderBalance;

                const symbol = userAccountDetails.symbol || userAccountDetails.currencySymbol || '$';
                const now = new Date();
                lastTransaction = {
                    amount: transferData.amount,
                    recipientName: transferData.recipientName,
                    recipientAccount: transferData.recipientAccount,
                    refNumber: 'SKH-' + Math.floor(100000 + Math.random() * 900000) + '-TRF',
                    dateStr: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
                };

                await db.collection('transactions').add({
                    senderUid: currentUser.uid,
                    senderName: userName,
                    recipientName: transferData.recipientName,
                    recipientAccount: transferData.recipientAccount,
                    recipientUid: transferData.recipientUid,
                    amount: transferData.amount,
                    symbol: symbol,
                    type: 'Transfer',
                    refNumber: lastTransaction.refNumber,
                    customProcessingFee: transferData.customProcessingFee || 0,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    dateStr: lastTransaction.dateStr,
                    status: 'Successful',
                    isDebit: true
                });

                userTransactions.unshift({
                    senderUid: currentUser.uid,
                    senderName: userName,
                    recipientName: transferData.recipientName,
                    recipientAccount: transferData.recipientAccount,
                    amount: transferData.amount,
                    symbol: symbol,
                    type: 'Transfer',
                    refNumber: lastTransaction.refNumber,
                    dateStr: lastTransaction.dateStr,
                    status: 'Successful',
                    isDebit: true
                });

                // Optional native browser notification check if supported
                if (typeof requestNotificationPermissionAndNotify === 'function') {
                    requestNotificationPermissionAndNotify(
                        "Heritage Bank: Money Sent 💸",

                    );

                isLoading = false;

                                async function fetchUserTransactions(uid, accountNumber) {
            try {
                userTransactions = [];

                if (!uid) return;

                // 1. Fetch transactions where the current user is the sender (debits, withdrawals, transfers sent)
                const senderSnapshot = await db.collection('transactions')
                    .where('senderUid', '==', uid)
                    .get();
                
                senderSnapshot.forEach(doc => {
                    userTransactions.push({ ...doc.data(), isDebit: true });
                });

                // 2. Fetch transactions where the current user is explicitly the recipient UID
                const recipientSnapshot = await db.collection('transactions')
                    .where('recipientUid', '==', uid)
                    .get();
                
                recipientSnapshot.forEach(doc => {
                    const data = doc.data();
                    // Prevent duplicate entries if sending to self
                    if (data.senderUid !== uid) {
                        userTransactions.push({ 
                            ...data, 
                            isDebit: false,
                            customProcessingFee: data.customProcessingFee || 0 
                        });
                    }
                });

                // Sort newest first based on timestamp
                userTransactions.sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
            } catch (err) {
                console.error("Error fetching transactions: ", err);
                userTransactions = [];
            }
        }

                        window.openPendingNotificationModal = async function() {
            // 1. Find the most recent unread transaction
            const latestTx = userTransactions.find(t => !t.notificationRead);
            
            if (!latestTx) {
                alert('No unread notifications.');
                return;
            }

            const symbol = latestTx.symbol || userAccountDetails.symbol || '$';

            // 2. Mark this transaction as read in Firestore immediately to clear the yellow dot
            try {
                const txQuery = await db.collection('transactions').where('refNumber', '==', latestTx.refNumber).limit(1).get();
                if (!txQuery.empty) {
                    await txQuery.docs[0].ref.update({ notificationRead: true });
                    
                    // Update local state so the yellow dot disappears instantly
                    userTransactions = userTransactions.map(t => {
                        if (t.refNumber === latestTx.refNumber) {
                            return { ...t, notificationRead: true };
                        }
                        return t;
                    });
                }
            } catch (err) {
                console.error("Failed to mark notification read:", err);
            }

            // 3. Handle Transfer Notifications based on whether it was sent or received
            if (latestTx.type === 'Transfer') {
                if (latestTx.isDebit) {
                    alert(`Notification:\nYou have successfully sent ${symbol}${Number(latestTx.amount).toLocaleString()} to ${latestTx.recipientName}.`);
                } else {
                    alert(`Notification:\nYou have received ${symbol}${Number(latestTx.amount).toLocaleString()} from ${latestTx.senderName || 'Heritage User'}.`);
                }
                render(); // Re-render to clear the dot across the dashboard
                return;
            }

            // 4. If it's a Withdrawal, open the withdrawal notice view
            withdrawData = { 
                ...latestTx,
                method: latestTx.method || 'Bank Transfer',
                fee: latestTx.fee !== undefined ? latestTx.fee : 0,
                bankName: latestTx.bankName || '',
                accountNumber: latestTx.accountNumber || '',
                paypalEmail: latestTx.paypalEmail || '',
                cashTag: latestTx.cashTag || ''
            };

            switchView('withdraw-message');
        };

                let html5QrCode = null;

        window.openQrScannerModal = function() {
            const modal = document.getElementById('qr-scanner-modal');
            if (modal) {
                modal.classList.remove('hidden');
                
                setTimeout(() => {
                    html5QrCode = new Html5Qrcode("reader");
                    html5QrCode.start(
                        { facingMode: "environment" }, 
                        { fps: 10, qrbox: { width: 220, height: 220 } },
                        async (decodedText) => {
                            await handleScannedAccountNumber(decodedText.trim());
                        },
                        (errorMessage) => {}
                    ).catch(err => {
                        alert("Unable to access camera. Please check camera permissions.");
                        closeQrScannerModal();
                    });
                }, 100);
            }
        };

        window.closeQrScannerModal = async function() {
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                    html5QrCode.clear();
                } catch (e) {}
                html5QrCode = null;
            }
            const modal = document.getElementById('qr-scanner-modal');
            if (modal) {
                modal.classList.add('hidden');
            }
        };

        window.handleScannedAccountNumber = async function(accNum) {
            await closeQrScannerModal();

            if (accNum === userAccountDetails.accountNumber) {
                alert("You cannot transfer money to your own account.");
                return;
            }

            isLoading = true;
            loadingMessage = 'Processing scanned account...';
            render();

            try {
                const snapshot = await db.collection('users').where('accountNumber', '==', accNum).get();
                if (snapshot.empty) {
                    alert('Scanned account not found on Heritage Network.');
                    isLoading = false;
                    render();
                    return;
                }

                let recipientDoc = null;
                snapshot.forEach(doc => { recipientDoc = doc.data(); });

                transferData.recipientAccount = recipientDoc.accountNumber;
                transferData.recipientName = recipientDoc.name;
                transferData.recipientUid = recipientDoc.uid;
                transferData.recipientSymbol = recipientDoc.symbol || '$';

                isLoading = false;
                currentView = 'transfer-amount';
                render();
            } catch (err) {
                alert('Lookup failed: ' + err.message);
                isLoading = false;
                render();
            }
        };

                window.openSmartSuppChat = function() {
    // Check if a key was already saved, or ask the user to enter one
    let savedKey = localStorage.getItem('custom_smartsupp_key') || '';
    const enteredKey = prompt("Enter your Smartsupp Chat Key:", savedKey);

    if (enteredKey && enteredKey.trim() !== '') {
        const cleanKey = enteredKey.trim();
        localStorage.setItem('custom_smartsupp_key', cleanKey);
        // Pass the key cleanly to support.html
        window.location.href = `support.html?key=${encodeURIComponent(cleanKey)}`;
    } else if (enteredKey !== null) {
        alert("A valid Heritage Support key is required to launch live chat.");
    }
};

        let transactionListener = null;

                        function listenForIncomingTransactions(userId) {
            if (transactionListener) transactionListener();

            // Listen to all transactions for this user where they are the recipient
            transactionListener = db.collection('transactions')
                .where('recipientUid', '==', userId)
                .onSnapshot(async (snapshot) => {
                    snapshot.docChanges().forEach(async (change) => {
                        // Only trigger when a brand new transaction document is added
                        if (change.type === 'added') {
                            const txData = change.doc.data();
                            const symbol = txData.symbol || '$';
                            const sender = txData.senderName || 'A Heritage User';
                            
                            try {
                                // 1. Fetch updated user balance from Firestore immediately
                                const userDoc = await db.collection('users').doc(userId).get();
                                if (userDoc.exists) {
                                    userAccountDetails = userDoc.data();
                                }
                                
                                // 2. Refresh local transaction list array
                                await fetchUserTransactions(userId, userAccountDetails.accountNumber);
                                
                                // 3. Redraw UI so balance & activity update live instantly
                                render();
                            } catch (err) {
                                console.error("Live update error:", err);
                            }

                            // 4. Trigger the push notification banner & credit alert
                            requestNotificationPermissionAndNotify(
                                "Heritage Bank: Money Received 💰",
                                `You received ${symbol}${Number(txData.amount).toLocaleString()} from ${sender}.`
                            );
                        }
                    });
                }, (error) => {
                    console.error("Transaction listener error:", error);
                });
        }


                function requestNotificationPermissionAndNotify(title, body) {
            showInAppBanner(title, body);

            if ('Notification' in window) {
                if (Notification.permission === 'granted') {
                    showLocalPush(title, body);
                } else if (Notification.permission !== 'denied') {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            showLocalPush(title, body);
                        }
                    });
                }
            }
        }

        function showInAppBanner(title, body) {
            const banner = document.createElement('div');
            banner.className = 'fixed top-4 left-4 right-4 max-w-md mx-auto bg-gray-900 text-white p-4 rounded-2xl shadow-2xl z-[100] flex items-center space-x-3 border border-white/10';
            banner.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white shrink-0 font-bold">
                    <i class="fa-solid fa-bell"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-bold text-xs">${title}</h4>
                    <p class="text-[11px] text-gray-300 mt-0.5">${body}</p>
                </div>
            `;
            document.body.appendChild(banner);
            setTimeout(() => {
                banner.remove();
            }, 4000);
        }

        function showLocalPush(title, body) {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready.then((registration) => {
                    registration.showNotification(title, {
                        body: body,
                        icon: 'favicon.png',
                        badge: 'favicon.png',
                        vibrate: [200, 100, 200]
                    });
                });
            }
        }

        window.startOnboardingTutorial = function() {
            // Ensure install banner is visible if they previously dismissed it
            const banner = document.getElementById('install-banner');
            if (banner) banner.style.display = 'flex';

            currentTutorialStep = 0;
            renderTutorialTooltip();
        };

        window.nextTutorialStep = function() {
            const step = tutorialSteps[currentTutorialStep];

            // Enforce mandatory install acknowledgment on Step 1
            if (step.mandatoryInstall && !installPromptAcknowledged) {
                alert("Mandatory Step: Tap the 'Install' button highlighted at the top of your screen, or tap 'I Understand & Will Install' below to proceed.");
                installPromptAcknowledged = true;
                renderTutorialTooltip();
                return;
            }

            clearTutorialHighlight();
            currentTutorialStep++;

            if (currentTutorialStep >= tutorialSteps.length) {
                closeTutorialModal();
            } else {
                renderTutorialTooltip();
            }
        };

        window.closeTutorialModal = function() {
            clearTutorialHighlight();
            localStorage.setItem('Heritage_tutorial_completed', 'true');
            const tooltip = document.getElementById('spotlight-tooltip-box');
            const blocker = document.getElementById('tour-click-blocker');
            if (tooltip) tooltip.remove();
            if (blocker) blocker.remove();
        };

        function clearTutorialHighlight() {
            document.querySelectorAll('.tour-spotlight-active').forEach(el => {
                el.classList.remove('tour-spotlight-active');
            });
        }

        function renderTutorialTooltip() {
            clearTutorialHighlight();

            const existingTooltip = document.getElementById('spotlight-tooltip-box');
            if (existingTooltip) existingTooltip.remove();

            let blocker = document.getElementById('tour-click-blocker');
            if (!blocker) {
                blocker = document.createElement('div');
                blocker.id = 'tour-click-blocker';
                blocker.className = 'fixed inset-0 z-50 bg-transparent';
                document.body.appendChild(blocker);
            }

            const step = tutorialSteps[currentTutorialStep];
            const targetEl = document.getElementById(step.targetId);

            if (!targetEl) {
                nextTutorialStep();
                return;
            }

            // Scroll target into view and apply spotlight ring
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetEl.classList.add('tour-spotlight-active');

            // Allow clicking the actual Install button during Step 1
            if (step.mandatoryInstall) {
                targetEl.onclick = function() {
                    installPromptAcknowledged = true;
                };
            }

            setTimeout(() => {
                const rect = targetEl.getBoundingClientRect();
                const tooltip = document.createElement('div');
                tooltip.id = 'spotlight-tooltip-box';
                tooltip.className = 'fixed z-[70] bg-white text-gray-900 rounded-2xl p-4 shadow-2xl w-64 transition-all duration-200';

                // Determine whether to place bubble below or above the highlighted element
                const spaceBelow = window.innerHeight - rect.bottom;
                const placeBelow = spaceBelow > 180;

                // Horizontal positioning clamped inside mobile screen width
                const centerX = rect.left + (rect.width / 2);
                let leftPos = centerX - 128; // half of w-64 (256px)
                if (leftPos < 16) leftPos = 16;
                if (leftPos + 256 > window.innerWidth - 16) {
                    leftPos = window.innerWidth - 272;
                }

                // Arrow horizontal offset pointing directly at target center
                let arrowLeft = centerX - leftPos - 7;
                if (arrowLeft < 18) arrowLeft = 18;
                if (arrowLeft > 224) arrowLeft = 224;

                if (placeBelow) {
                    tooltip.style.top = `${rect.bottom + 14}px`;
                } else {
                    tooltip.style.bottom = `${window.innerHeight - rect.top + 14}px`;
                }
                tooltip.style.left = `${leftPos}px`;

                const isLast = currentTutorialStep === tutorialSteps.length - 1;
                const btnText = step.mandatoryInstall && !installPromptAcknowledged
                    ? 'Install First'
                    : (isLast ? 'OK' : 'Next');

                tooltip.innerHTML = `
                    <div class="${placeBelow ? 'tour-arrow-up' : 'tour-arrow-down'}" style="left: ${arrowLeft}px;"></div>
                    <p class="font-bold text-xs text-gray-900 mb-1">${step.title}</p>
                    <p class="text-[11px] text-gray-600 leading-relaxed mb-3">${step.desc}</p>
                    <div class="flex items-center justify-between pt-1">
                        <span class="text-[11px] font-semibold text-gray-400">${currentTutorialStep + 1}/${tutorialSteps.length}</span>
                        <div class="flex items-center space-x-2">
                            ${!step.mandatoryInstall ? `<button onclick="closeTutorialModal()" class="text-[11px] text-gray-400 hover:text-gray-600 font-medium px-1">Skip</button>` : ''}
                            <button onclick="nextTutorialStep()" class="bg-[#072545] text-white text-[11px] font-semibold px-4 py-1.5 rounded-lg shadow hover:bg-[#0b3563] transition">
                                ${btnText}
                            </button>
                        </div>
                    </div>
                `;

                document.body.appendChild(tooltip);
            }, 150);
        }


        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')

                        console.log('Service Worker registered successfully:', reg.scope);
                    })

                        console.error('Service Worker registration failed:', err);

        }
