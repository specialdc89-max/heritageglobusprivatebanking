<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#051937] text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white text-gray-900 rounded-3xl p-6 max-w-md w-full shadow-2xl text-center space-y-4">
        <h1 class="text-xl font-bold text-[#072545]">Live Customer Support</h1>
        <p id="status-text" class="text-xs text-gray-500">Connecting you to your dedicated support agent...</p>
        
        <div class="pt-2 space-y-2.5">
            <button onclick="forceOpenChat()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-full text-xs shadow">
                Open Chat Window
            </button>
            <button onclick="changeSmartsuppKey()" class="w-full bg-blue-50 text-blue-600 font-semibold py-2.5 rounded-full text-xs">
                Change Smartsupp Key
            </button>
            <button onclick="window.location.href='index.html'" class="w-full bg-[#072545] text-white font-semibold py-3 rounded-full text-xs">
                Back to Banking
            </button>
        </div>
    </div>

    <script type="text/javascript">
        const urlParams = new URLSearchParams(window.location.search);
        const activeKey = (urlParams.get('key') || localStorage.getItem('custom_smartsupp_key') || '').trim();

        if (!activeKey) {
            alert("No Smartsupp key provided. Returning to dashboard.");
            window.location.href = 'index.html';
        } else {
            var _smartsupp = _smartsupp || {};
            _smartsupp.key = activeKey;

            window.smartsupp || (function(d) {
                var s, c, o = smartsupp = function() { o._.push(arguments); };
                o._ = [];
                s = d.getElementsByTagName('script')[0];
                c = d.createElement('script');
                c.type = 'text/javascript';
                c.charset = 'utf-8';
                c.async = true;
                c.src = 'https://www.smartsuppchat.com/loader.js?';
                s.parentNode.insertBefore(c, s);
            })(document);

            // Queue commands to execute the exact moment Smartsupp finishes rendering
            smartsupp('on', 'rendered', function() {
                document.getElementById('status-text').innerText = 'Connected! Opening chat...';
                smartsupp('chat:show');
                smartsupp('chat:open');
            });

            // Backup trigger once the iframe enters the page
            const waitForWidget = setInterval(() => {
                const widgetFrame = document.querySelector('iframe[src*="smartsupp"]');
                if (widgetFrame) {
                    clearInterval(waitForWidget);
                    document.getElementById('status-text').innerText = 'Agent online. Tap Open Chat Window if minimized.';
                    smartsupp('chat:show');
                    smartsupp('chat:open');
                }
            }, 600);

            // Stop checking after 15 seconds if key is invalid
            setTimeout(() => {
                clearInterval(waitForWidget);
                if (!document.querySelector('iframe[src*="smartsupp"]')) {
                    document.getElementById('status-text').innerText = 'Could not connect. Check that your Smartsupp key is valid.';
                }
            }, 15000);
        }

        function forceOpenChat() {
            if (typeof smartsupp === 'function') {
                smartsupp('chat:show');
                smartsupp('chat:open');
            }
        }

        function changeSmartsuppKey() {
            const newKey = prompt("Enter a new Smartsupp Key:", activeKey || '');
            if (newKey && newKey.trim() !== '') {
                localStorage.setItem('custom_smartsupp_key', newKey.trim());
                window.location.href = `support.html?key=${encodeURIComponent(newKey.trim())}`;
            }
        }
    </script>
</body>
</html>
