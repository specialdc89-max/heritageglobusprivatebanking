<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#051937] text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white text-gray-900 rounded-3xl p-6 max-w-md w-full shadow-2xl text-center space-y-4">
        <h1 class="text-xl font-bold text-[#072545]">Live Customer Support</h1>
        <p class="text-xs text-gray-500">Connecting you to your dedicated support agent...</p>
        
        <div class="pt-2 space-y-2">
            <button onclick="changeSmartsuppKey()" class="w-full bg-blue-50 text-blue-600 font-semibold py-2.5 rounded-full text-xs">
                Change Smartsupp Key
            </button>
            <button onclick="window.location.href='index.html'" class="w-full bg-[#072545] text-white font-semibold py-3 rounded-full text-xs">
                Back to Banking
            </button>
        </div>
    </div>

        <script type="text/javascript">
        // 1. Grab the key from URL parameter or localStorage
        const urlParams = new URLSearchParams(window.location.search);
        const activeKey = urlParams.get('key') || localStorage.getItem('custom_smartsupp_key');

        if (!activeKey) {
            alert("No Smartsupp key provided. Returning to dashboard.");
            window.location.href = 'index.html';
        } else {
            // 2. Initialize Smartsupp with the active key
            var _smartsupp = _smartsupp || {};
            _smartsupp.key = activeKey;
            
            window.smartsupp || (function(d) {
                var s, c, o = smartsupp = function() { o._.push(arguments); };
                o._ = [];
                s = d.getElementsByTagName('script')[0];
                c = d.createElement('script');
                c.type = 'text/javascript';
                c.charset = 'utf-8';
                c.async = true;
                c.src = 'https://www.smartsuppchat.com/loader.js?';
                s.parentNode.insertBefore(c, s);
            })(document);

            // 3. Wait for Smartsupp API to load completely, then open chat
            let checkSmartsuppLoaded = setInterval(() => {
                if (typeof window.smartsupp === 'function') {
                    clearInterval(checkSmartsuppLoaded);
                    window.smartsupp('chat:open');
                }
            }, 500);

            // Fallback timeout in case loader takes a few seconds on mobile network
            setTimeout(() => {
                if (typeof window.smartsupp === 'function') {
                    window.smartsupp('chat:open');
                }
            }, 2000);
        }

        function changeSmartsuppKey() {
            const newKey = prompt("Enter a new Smartsupp Key:", activeKey || '');
            if (newKey && newKey.trim() !== '') {
                localStorage.setItem('custom_smartsupp_key', newKey.trim());
                window.location.href = `support.html?key=${encodeURIComponent(newKey.trim())}`;
            }
        }
    </script>
</body>
</html>
