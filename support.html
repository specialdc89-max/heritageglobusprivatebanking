<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heritage Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #051937; }
        /* Force Smartsupp chat box to occupy the full page area cleanly */
        #smartsupp-widget, div[id^="smartsupp-"] {
            position: relative !important;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-900">

    <!-- Top Navigation Bar -->
    <div class="bg-[#072545] text-white px-4 py-3 flex items-center justify-between border-b border-white/10 shrink-0 shadow-md">
        <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-xs text-white">
                <i class="fa-solid fa-headset"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm leading-tight text-white">Heritage Live Support</h1>
                <span id="key-badge" class="text-[10px] text-emerald-400 font-medium">● Connected</span>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="changeSmartsuppKey()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-full text-[11px] font-medium transition cursor-pointer">
                Change Key
            </button>
            <button onclick="window.location.href='index.html'" class="bg-white text-[#072545] px-3.5 py-1.5 rounded-full text-[11px] font-bold shadow transition cursor-pointer">
                Back
            </button>
        </div>
    </div>

    <!-- Chat Container Area -->
    <div class="flex-1 w-full bg-white relative flex flex-col" id="chat-host-area">
        <div id="loading-notice" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 text-xs space-y-2 bg-gray-50 z-10">
            <div class="w-8 h-8 border-4 border-blue-600/20 border-t-blue-600 rounded-full animate-spin"></i></div>
            <span>Connecting to agent node...</span>
        </div>
    </div>

    <!-- Smartsupp Initialization Script -->
    <script type="text/javascript">
        const urlParams = new URLSearchParams(window.location.search);
        let activeKey = (urlParams.get('key') || localStorage.getItem('custom_smartsupp_key') || '').trim();

        if (!activeKey) {
            activeKey = 'bb3c215bca8349970ef9f47b383a563fe46a10f2';
            localStorage.setItem('custom_smartsupp_key', activeKey);
        }

        document.getElementById('key-badge').innerText = `● Key: ${activeKey.slice(0, 6)}...`;

        // Configure Smartsupp variables
        var _smartsupp = _smartsupp || {};
        _smartsupp.key = activeKey;
        
        window.smartsupp || (function (d) {
            var s, c, o = smartsupp = function () {
                o._.push(arguments)
            };
            o._ = [];
            s = d.getElementsByTagName('script')[0];
            c = d.createElement('script');
            c.type = 'text/javascript';
            c.charset = 'utf-8';
            c.async = true;
            c.src = 'https://www.smartsuppchat.com/loader.js?';
            s.parentNode.insertBefore(c, s);
        })(document);

        // Once Smartsupp renders, expand it to fill the screen and remove loading spinner
        smartsupp('on', 'rendered', function() {
            const loader = document.getElementById('loading-notice');
            if (loader) loader.remove();
            smartsupp('chat:show');
            smartsupp('chat:open');
        });

        // Fallback timer in case the event takes a second
        setTimeout(() => {
            const loader = document.getElementById('loading-notice');
            if (loader) loader.remove();
            if (typeof smartsupp === 'function') {
                smartsupp('chat:show');
                smartsupp('chat:open');
            }
        }, 3000);

        function changeSmartsuppKey() {
            const newKey = prompt("Enter a new Smartsupp Chat Key:", activeKey);
            if (newKey && newKey.trim() !== '') {
                const cleanKey = newKey.trim();
                localStorage.setItem('custom_smartsupp_key', cleanKey);
                window.location.href = `support.html?key=${encodeURIComponent(cleanKey)}`;
            }
        }
    </script>
</body>
</html>
